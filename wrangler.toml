# Cloudflare Workers + Static Assets 配置（新版向导，Deploy command = npx wrangler deploy）
# 文档: https://developers.cloudflare.com/workers/static-assets/

name = "iptv-pages"
main = "src/index.js"
compatibility_date = "2026-11-25"
upload_source_maps = true

[assets]
directory = "./web"
binding = "ASSETS"
# 让所有请求先经过 Worker：需要处理根路径跳转、静态重写、安全头注入、API
run_worker_first = true

# KV：订阅源、频道、配置全部存在这里（不再依赖本地 Docker 后端）
[[kv_namespaces]]
binding = "IPTV_KV"
id = "1c84e7b651284d499e5fc36d81f747b7"
preview_id = "304707adff8b4fcca2af5e324ec49b22"

# ADMIN_PASS：管理页访问密码（可选）。设置后需在请求头带 X-Admin-Pass 才能写操作。
# 在 Cloudflare 控制台 Settings → Environment variables 添加；本地放 .dev.vars。
# 注意：此版本为纯 KV 存储，无需 BACKEND_ORIGIN / BACKEND_PASS / BACKEND_PREFIX。
